<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero Block with Text | Rodrigo Araújo</title>
    <meta name="description" content="A class exercise demonstrating a hero block with text.">
    <!-- Rodrigo Araújo 83681 -->
    <link rel="icon" type="image/png" href="../assets/img/favicon-32x32.png">
    
    <!-- TailwindCSS browser version, as used in the class tutorials. -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">

        body { @apply bg-slate-50 text-slate-900 font-sans; }
        header { @apply bg-slate-900 text-white px-6 md:px-12 py-12 text-center; }
        header > * { @apply max-w-3xl mx-auto; }
        header h1 { @apply text-4xl md:text-6xl font-bold tracking-tight mb-5; }
        header h2 { @apply text-xl md:text-2xl font-normal leading-relaxed; }
        main { @apply max-w-3xl mx-auto; }
        section { @apply px-6 md:px-10 py-8; }
        h2 { @apply text-2xl md:text-3xl font-semibold tracking-tight mb-5; }
        h3 { @apply text-xl md:text-2xl font-semibold mt-8 mb-4; }
        p { @apply text-lg leading-relaxed mb-5; }
        a { @apply text-blue-800 underline underline-offset-4 hover:text-blue-950 focus-visible:outline-2 focus-visible:outline-offset-4; }
        header a { @apply text-white; }
        ul { @apply list-disc pl-6 space-y-3 text-lg; }
        img { @apply max-w-full h-auto my-6 rounded-lg; }
        footer { @apply px-6 py-8 text-center bg-slate-200; }
        footer p { @apply text-sm mb-2; }
        .eyebrow { @apply text-sm font-semibold uppercase tracking-widest mb-4; }
        .intro { @apply italic leading-relaxed; }

        header { @apply relative min-h-[60vh] md:min-h-[80vh] flex flex-col justify-center px-6 md:px-12 py-16 overflow-hidden; }
        header h1 { @apply relative z-10 text-4xl md:text-7xl; }
        header h2 { @apply relative z-10 text-xl md:text-3xl; }
        header { @apply bg-linear-to-b from-blue-800 to-blue-950; }

        .slide-in-top { animation: slide-in-top 1s ease-out both; }
        .slide-in-left { animation: slide-in-left 1s ease-out both; }
        @keyframes slide-in-top { from { transform: translateY(-40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes slide-in-left { from { transform: translateX(-40px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @media (prefers-reduced-motion: reduce) { .slide-in-top, .slide-in-left { animation: none; } }

    </style>
</head>
<body id="top">
    <!-- Adapted from Brendan Munnelly's hero-text tutorial sample. -->
    <header>
        <h1 class="slide-in-top">Rodrigo Araújo</h1>
        <h2 class="slide-in-left">Front-end Development Student</h2>
    </header>
    <main>
        <section>
            <h2>Hero Block with Text</h2>
            <p>This example has a blue background that changes from light to dark. The headings move into place when the page opens.</p>
        </section>
    </main>
    <footer>
        <p><a href="../index.html">Back to Home</a> · <a href="#top">Back to top</a></p>
        <p>Rodrigo Araújo · Front-end Web Development 1 · CA1</p>
    </footer>
</body>
</html>
